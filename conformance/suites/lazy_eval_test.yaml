---
name: LazyEvaluationConformance
description: >-
  Only what can affect the decision is evaluated. A derived role is evaluated
  only when a rule of the requested action references it, and a scope only
  when the walk reaches it, so an erroring condition elsewhere cannot affect
  the request. Both engines agree here; where the erroring condition IS
  reached they still differ in how (Cerbos skips the rule, Kerberos fails
  closed), which conderr_test.yaml records.

principals:
  owner:
    id: u1
    roles: ['USER']
  stranger:
    id: u2
    roles: ['USER']

resources:
  item:
    id: l1
    kind: lazyeval
    attr:
      ownerId: u1
  scoped:
    id: s1
    kind: lazyscope
    scope: lazyscope
    attr: {}

tests:
  - name: an erroring derived role no rule of the action references is never evaluated
    input:
      principals: [owner, stranger]
      resources: [item]
      actions: [view]
    expected:
      - principal: owner
        resource: item
        actions: { view: EFFECT_ALLOW }
      - principal: stranger
        resource: item
        actions: { view: EFFECT_ALLOW }

  - name: a referenced derived role still decides
    input:
      principals: [owner, stranger]
      resources: [item]
      actions: [edit]
    expected:
      - principal: owner
        resource: item
        actions: { edit: EFFECT_ALLOW }
      - principal: stranger
        resource: item
        actions: { edit: EFFECT_DENY }

  - name: a referenced erroring derived role never grants
    description: >-
      Cerbos treats the erroring condition as not satisfied; Kerberos fails
      closed. Either way the only rule for `break` cannot allow.
    input:
      principals: [owner]
      resources: [item]
      actions: [break]
    expected:
      - principal: owner
        resource: item
        actions: { break: EFFECT_DENY }

  - name: a scope the walk never reaches is never evaluated
    description: >-
      The scoped policy decides `view`; the base scope's erroring DENY rule is
      never evaluated (Kerberos 4.2 evaluated every scope and failed closed).
    input:
      principals: [owner]
      resources: [scoped]
      actions: [view]
    expected:
      - principal: owner
        resource: scoped
        actions: { view: EFFECT_ALLOW }
