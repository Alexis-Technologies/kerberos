---
name: ConflictResolutionConformance
description: >-
  Pins how an ALLOW and a DENY that both match one action are combined. The
  multi-role case (`support_auditor`) is the one to watch on the first run
  against a live Cerbos PDP — see DIVERGENCES.md.

principals:
  support:
    id: s1
    roles: ['SUPPORT']
  auditor:
    id: a1
    roles: ['AUDITOR']
  support_auditor:
    id: sa1
    roles: ['SUPPORT', 'AUDITOR']

resources:
  open_ticket:
    id: t1
    kind: ticket
    attr:
      locked: false
  locked_ticket:
    id: t2
    kind: ticket
    attr:
      locked: true

tests:
  - name: a single role with only an ALLOW gets the allow
    input:
      principals: [support]
      resources: [open_ticket]
      actions: [close, comment]
    expected:
      - principal: support
        resource: open_ticket
        actions: { close: EFFECT_ALLOW, comment: EFFECT_ALLOW }

  - name: a single role with only a DENY gets the deny
    input:
      principals: [auditor]
      resources: [open_ticket]
      actions: [close]
    expected:
      - principal: auditor
        resource: open_ticket
        actions: { close: EFFECT_DENY }

  - name: within one role a conditional DENY overrides an earlier ALLOW
    description: >-
      Both `support-may-comment` and `nobody-comments-on-locked` match for a
      SUPPORT principal on a locked ticket, and the ALLOW is listed first. Deny
      wins, so rule order does not decide the outcome.
    input:
      principals: [support]
      resources: [locked_ticket]
      actions: [comment]
    expected:
      - principal: support
        resource: locked_ticket
        actions: { comment: EFFECT_DENY }

  - name: KNOWN DIVERGENCE — a DENY scoped to another role
    description: >-
      Kerberos is deny-overrides unconditionally, so the AUDITOR deny wins.
      Cerbos >= 0.41 is deny-overrides *within* a role but allow-overrides
      *across* roles (anti-lockout), so the SUPPORT allow wins. Verified against
      a real PDP. See DIVERGENCES.md — `cerbosActions` records the other
      engine's behaviour so the difference stays pinned instead of hidden.
    input:
      principals: [support_auditor]
      resources: [open_ticket]
      actions: [close]
    expected:
      - principal: support_auditor
        resource: open_ticket
        actions: { close: EFFECT_DENY }
        cerbosActions: { close: EFFECT_ALLOW }

  - name: a blanket DENY still overrides an ALLOW from any role
    description: >-
      Bounds the divergence above. `roles: ['*']` covers the allowing role too,
      so both engines deny — blanket denies are not affected.
    input:
      principals: [support_auditor, support]
      resources: [open_ticket]
      actions: [escalate]
    expected:
      - principals: [support_auditor, support]
        resource: open_ticket
        actions: { escalate: EFFECT_DENY }

  - name: a DENY that also enumerates the allowing role wins
    description: >-
      Bounds the divergence from the other side: once the DENY covers SUPPORT
      as well, Cerbos's per-role resolution denies too, and the engines agree.
    input:
      principals: [support_auditor]
      resources: [open_ticket]
      actions: [delete]
    expected:
      - principal: support_auditor
        resource: open_ticket
        actions: { delete: EFFECT_DENY }
